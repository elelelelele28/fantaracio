<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Fantaracio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@500;600;700&display=swap">
<style>
/* Layout: one narrow column like the printed sheet; sticky score bar on top, share bar at the bottom */
:root{
  --bg:#ffffff; --fg:#1a1717; --muted:#5e5557; --line:#e9e1e2;
  --accent:#7a1c2b; --accent-soft:#f6e9eb; --minus:#7a1c2b; --chip:#faf6f6;
  --display:'Fredoka', 'Quicksand', system-ui, sans-serif;
  --body:'Quicksand', system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#171213; --fg:#f4eeee; --muted:#b9adaf; --line:#3a2e30;
    --accent:#e57a8c; --accent-soft:#3a1e24; --minus:#e57a8c; --chip:#211a1b; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#171213; --fg:#f4eeee; --muted:#b9adaf; --line:#3a2e30;
  --accent:#e57a8c; --accent-soft:#3a1e24; --minus:#e57a8c; --chip:#211a1b; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.35;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 140px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(44px,13vw,64px);letter-spacing:0.04em;line-height:1;margin:8px 0 4px;text-align:center;text-wrap:balance}
.sub{text-align:center;color:var(--muted);font-weight:600;margin:0 0 20px}
.name{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.name label{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:0.06em;text-transform:uppercase}
.name input{font:600 18px var(--body);color:var(--fg);background:var(--chip);border:2px solid var(--line);border-radius:12px;padding:12px 14px;width:100%}
.name input:focus{outline:none;border-color:var(--accent)}
.score{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:2px solid var(--line);padding:10px 0;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.score span{font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:0.06em;color:var(--accent)}
.score b{font-family:var(--display);font-weight:700;font-size:38px;font-variant-numeric:tabular-nums}
h2{font-family:var(--display);font-weight:600;font-size:30px;color:var(--accent);margin:24px 0 10px;letter-spacing:0.02em}
.list{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.item{width:100%;display:flex;align-items:center;gap:12px;text-align:left;font:600 16px var(--body);color:var(--fg);background:var(--chip);border:2px solid var(--line);border-radius:14px;padding:12px 14px;min-height:56px;cursor:pointer}
.item:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.box{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--accent);display:grid;place-items:center}
.box svg{width:16px;height:16px;opacity:0}
.txt{flex:1;min-width:0}
.pts{flex:none;font-family:var(--display);font-weight:600;font-size:17px;color:var(--accent);font-variant-numeric:tabular-nums}
.item[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.item[aria-pressed="true"] .box{background:var(--accent)}
.item[aria-pressed="true"] .box svg{opacity:1}
.foot{color:var(--muted);text-align:center;margin:28px 0 0;font-weight:600}
.reset{display:flex;justify-content:center;gap:8px;margin-top:14px;flex-wrap:wrap}
.ghost{font:600 14px var(--body);color:var(--muted);background:none;border:none;text-decoration:underline;padding:10px;cursor:pointer;min-height:44px}
.ghost.warn{color:var(--accent)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:2px solid var(--line);padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar-in{max-width:560px;margin:0 auto;display:flex;gap:8px}
.send{flex:1;display:flex;align-items:center;justify-content:center;font:700 17px var(--display);letter-spacing:0.02em;color:#fff;background:var(--accent);border-radius:14px;padding:14px;min-height:52px;text-decoration:none;text-align:center}
:root[data-theme="dark"] .send{color:#171213}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .send{color:#171213}}
.copy{flex:none;font:600 15px var(--body);color:var(--accent);background:var(--chip);border:2px solid var(--accent);border-radius:14px;padding:0 16px;min-height:52px;cursor:pointer}
.send[aria-disabled="true"]{opacity:0.45;pointer-events:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);font-weight:700;padding:10px 16px;border-radius:999px;z-index:7}
@media (prefers-reduced-motion: no-preference){.item{transition:background .15s,border-color .15s}.box svg{transition:opacity .15s}}
</style>
</head>
<body>

<div class="wrap">
  <h1>FANTARACIO</h1>
  <p class="sub">Spunta quello che fai durante la serata</p>

  <div class="name">
    <label for="nome">Nome</label>
    <input id="nome" type="text" autocomplete="given-name" placeholder="Scrivi il tuo nome" maxlength="40">
  </div>

  <div class="score" aria-live="polite"><span>TOTALE</span><b id="tot">0</b></div>

  <h2>BONUS</h2>
  <ul class="list" id="bonus"></ul>

  <h2>MALUS</h2>
  <ul class="list" id="malus"></ul>

  <p class="foot">Partecipa, che magari vinci qualcosa</p>
  <div class="reset">
    <button class="ghost" id="reset" type="button">Ricomincia da zero</button>
    <button class="ghost warn" id="resetYes" type="button" hidden>Sì, cancella tutto</button>
    <button class="ghost" id="resetNo" type="button" hidden>No</button>
  </div>
</div>

<div class="bar">
  <div class="bar-in">
    <a class="send" id="send" href="#" target="_blank" rel="noopener" aria-disabled="true">Manda il punteggio su WhatsApp</a>
    <button class="copy" id="copy" type="button">Copia</button>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function(){
  var BONUS=[
    ["b1","Selfie con la festeggiata",10],
    ["b2","Pubblica una storia e taggala",15],
    ["b3","Selfie con 2 persone che non conosci",25],
    ["b4","Fai un discorso per la festeggiata",50],
    ["b6","Fai partire un trenino",35],
    ["b7","Porta uno shot alla dottoressa",25],
    ["b8","Le scappa una raciolata davanti a te",30],
    ["b9","Parli male dei BTS (o dici qualcosa contro di loro)",50],
    ["b10","La festeggiata dice «belli miei»",15],
    ["b11","Fai partire un applauso per un invitato a caso",20],
    ["b12","La festeggiata dice «tesò»",10],
    ["b13","Fai una foto con un invitato che non conoscevi prima della festa",20],
    ["b14","Fai i complimenti alla festeggiata per l'organizzazione",15],
    ["b15","Chiedile la ricetta del suo piatto forte",15],
    ["b16","Foto con la dottoressa che mostra il bicipite",15],
    ["b17","Brinda «alla creatina!»",15]
  ];
  var MALUS=[
    ["m1","Non fai neanche una foto",-20],
    ["m2","Stai sempre seduto/a",-10],
    ["m3","Non partecipi ai cori",-30],
    ["m4","Macchi i vestiti",-10],
    ["m5","Chiedi: «E adesso cosa farai?»",-40],
    ["m6","Rompi un bicchiere o fai cadere del cibo",-20],
    ["m7","Te ne vai prima della torta",-40],
    ["m8","Arrivi in ritardo e le scombini la scaletta",-30],
    ["m9","Le correggi una raciolata",-20]
  ];
  var KEY="fantaracio-v1";
  var state={nome:"",done:{}};
  try{var raw=localStorage.getItem(KEY); if(raw){var s=JSON.parse(raw); if(s&&typeof s==="object"){state.nome=String(s.nome||""); state.done=s.done&&typeof s.done==="object"?s.done:{};}}}catch(e){}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}

  var CHECK='<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  function fmt(p){return (p>0?"+":"–")+Math.abs(p);}
  function build(list,el){
    list.forEach(function(it){
      var li=document.createElement("li");
      var b=document.createElement("button");
      b.type="button"; b.className="item"; b.id=it[0];
      b.setAttribute("aria-pressed",state.done[it[0]]?"true":"false");
      var box=document.createElement("span"); box.className="box"; box.innerHTML=CHECK;
      var t=document.createElement("span"); t.className="txt"; t.textContent=it[1];
      var p=document.createElement("span"); p.className="pts"; p.textContent=fmt(it[2]);
      b.appendChild(box); b.appendChild(t); b.appendChild(p);
      b.addEventListener("click",function(){
        if(state.done[it[0]]) delete state.done[it[0]]; else state.done[it[0]]=true;
        b.setAttribute("aria-pressed",state.done[it[0]]?"true":"false");
        save(); update();
      });
      li.appendChild(b); el.appendChild(li);
    });
  }
  build(BONUS,document.getElementById("bonus"));
  build(MALUS,document.getElementById("malus"));

  var nome=document.getElementById("nome");
  nome.value=state.nome;
  nome.addEventListener("input",function(){state.nome=nome.value; save(); update();});

  function total(){var t=0; BONUS.concat(MALUS).forEach(function(it){if(state.done[it[0]]) t+=it[2];}); return t;}
  function message(){
    var n=state.nome.trim()||"Senza nome";
    var lines=["FANTARACIO – "+n+": "+total()+" punti"];
    var b=BONUS.filter(function(it){return state.done[it[0]];});
    var m=MALUS.filter(function(it){return state.done[it[0]];});
    if(b.length){lines.push("","Bonus:"); b.forEach(function(it){lines.push("• "+it[1]+" "+fmt(it[2]));});}
    if(m.length){lines.push("","Malus:"); m.forEach(function(it){lines.push("• "+it[1]+" "+fmt(it[2]));});}
    return lines.join("\n");
  }
  var send=document.getElementById("send");
  function update(){
    document.getElementById("tot").textContent=total();
    var ok=state.nome.trim().length>0;
    send.setAttribute("aria-disabled",ok?"false":"true");
    send.textContent=ok?"Manda il punteggio su WhatsApp":"Scrivi il tuo nome per inviare";
    send.href="https://wa.me/?text="+encodeURIComponent(message());
  }
  update();

  var toast=document.getElementById("toast"), tt;
  function say(t){toast.textContent=t; toast.hidden=false; clearTimeout(tt); tt=setTimeout(function(){toast.hidden=true;},1800);}
  document.getElementById("copy").addEventListener("click",function(){
    var txt=message();
    function fallback(){
      var ta=document.createElement("textarea"); ta.value=txt; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
      document.body.appendChild(ta); ta.select();
      var ok=false; try{ok=document.execCommand("copy");}catch(e){}
      document.body.removeChild(ta);
      say(ok?"Copiato, incollalo nel gruppo":"Non riesco a copiare, usa il tasto WhatsApp");
    }
    try{
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(function(){say("Copiato, incollalo nel gruppo");},fallback);
      } else fallback();
    }catch(e){fallback();}
  });

  var r=document.getElementById("reset"), ry=document.getElementById("resetYes"), rn=document.getElementById("resetNo");
  r.addEventListener("click",function(){r.hidden=true; ry.hidden=false; rn.hidden=false;});
  rn.addEventListener("click",function(){r.hidden=false; ry.hidden=true; rn.hidden=true;});
  ry.addEventListener("click",function(){
    state.done={}; save();
    document.querySelectorAll(".item").forEach(function(b){b.setAttribute("aria-pressed","false");});
    update(); r.hidden=false; ry.hidden=true; rn.hidden=true; say("Punteggio azzerato");
  });
})();
</script>

</body>
</html>
